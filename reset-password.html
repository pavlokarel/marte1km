<!doctype html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reimposta password · Marte1km</title><link rel="stylesheet" href="styles.css"></head><body class="legal-page"><main class="checkout-card"><a class="brand" href="index.html"><span class="brand-mark">M</span>marte<span>1km</span></a><p class="eyebrow" style="margin-top:42px">MISSION CONTROL / ACCOUNT</p><h1>Reimposta password</h1><p id="message" class="checkout-copy">Scegli una nuova password di almeno 8 caratteri.</p><form id="form"><label class="auth-field" for="password">Nuova password<input id="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="Almeno 8 caratteri"></label><label class="auth-field" for="confirmation">Ripeti password<input id="confirmation" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="Ripeti la password"></label><button class="buy-button checkout-submit" type="submit">Salva nuova password <span>↗</span></button></form><a class="buy-button legal-button" href="index.html">Torna al sito</a></main><script>
const form=document.querySelector('#form');const message=document.querySelector('#message');const token=new URLSearchParams(location.search).get('token');form.addEventListener('submit',async e=>{e.preventDefault();const password=document.querySelector('#password').value;const confirmation=document.querySelector('#confirmation').value;if(!token){message.textContent='Il link non contiene un token valido.';return}if(password!==confirmation){message.textContent='Le password non coincidono.';return}try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({token,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Impossibile aggiornare la password');message.textContent=d.message||'Password aggiornata. Ora puoi accedere.';form.hidden=true}catch(error){message.textContent=error.message}});
</script></body></html>
